<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Arigatho · OA and interview questions by company</title>
<meta name="description" content="Online-assessment and interview questions from campus placement drives, by company.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><circle cx='8' cy='8' r='6' fill='%23d97757'/></svg>">
<style>
  :root {
    --bg: #faf9f5; --surface: #ffffff; --text: #141413; --muted: #6b6a64;
    --border: #e8e6dc; --soft: #f0eee6; --accent: #d97757; --accent-dark: #b4532f;
    --sans: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    --serif: ui-serif, "Iowan Old Style", "Palatino Linotype", Georgia, serif;
    --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 16px/1.6 var(--sans); }
  .wrap { max-width: 780px; margin: 0 auto; padding: 0 16px; }
  a { color: inherit; }

  header { position: sticky; top: 0; z-index: 1; background: var(--bg); border-bottom: 1px solid var(--border); }
  header .wrap { display: flex; align-items: center; gap: 16px; padding-top: 12px; padding-bottom: 12px; }
  .brand { font: 600 21px/1 var(--serif); text-decoration: none; white-space: nowrap; }
  .brand::before { content: ""; display: inline-block; width: 9px; height: 9px; margin: 0 7px 2px 0;
                   border-radius: 50%; background: var(--accent); }
  #q { flex: 1; min-width: 0; font: inherit; padding: 8px 14px; color: var(--text); background: var(--surface);
       border: 1px solid var(--border); border-radius: 10px; outline: none; }
  #q::-webkit-search-cancel-button { filter: grayscale(1); }
  #q:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgb(217 119 87 / .15); }

  h1 { font: 600 30px/1.2 var(--serif); margin: 26px 0 6px; }
  h2 { font: 600 12px/1 var(--sans); letter-spacing: .07em; text-transform: uppercase; color: var(--muted);
       margin: 28px 0 10px; }
  .meta { color: var(--muted); font-size: 14px; }
  .crumb { margin: 22px 0 0; font-size: 14px; }
  .crumb a { color: var(--muted); text-decoration: none; }
  .crumb a:hover { color: var(--accent-dark); }

  /* home: A-Z companies */
  .az { columns: 3 210px; column-gap: 28px; margin-top: 18px; }
  .az section { break-inside: avoid; margin-bottom: 16px; }
  .az b { display: block; font: 600 15px var(--serif); color: var(--accent); margin-bottom: 2px; }
  .az a { display: flex; justify-content: space-between; gap: 8px; padding: 2px 0; text-decoration: none; }
  .az a:hover span:first-child { color: var(--accent-dark); text-decoration: underline; }
  .n { color: var(--muted); font-size: 14px; font-variant-numeric: tabular-nums; }

  /* search results */
  .chips { display: flex; flex-wrap: wrap; gap: 8px; }
  .chip { padding: 4px 12px; background: var(--surface); border: 1px solid var(--border); border-radius: 999px;
          text-decoration: none; }
  .chip:hover { border-color: var(--accent); }
  .row { display: block; padding: 10px 0; border-bottom: 1px solid var(--border); text-decoration: none; }
  .row span { display: block; }
  .row:hover span:first-child { color: var(--accent-dark); }

  /* company: questions */
  .tools { margin: 14px 0 0; }
  button { font: inherit; font-size: 14px; color: var(--text); background: var(--surface); cursor: pointer;
           border: 1px solid var(--border); border-radius: 8px; padding: 4px 12px; }
  button:hover { border-color: var(--accent); }
  .drive { margin: 28px 0 2px; font-size: 13px; font-weight: 600; color: var(--muted); }
  .q { border-bottom: 1px solid var(--border); scroll-margin-top: 112px; }
  .q summary { display: flex; align-items: baseline; gap: 10px; padding: 9px 0; cursor: pointer; list-style: none; }
  .q summary::-webkit-details-marker { display: none; }
  .q summary::before { content: "›"; flex: none; width: 10px; color: var(--accent); font-weight: 700;
                       transition: transform .15s; }
  .q[open] summary::before { transform: rotate(90deg); }
  .q summary span:first-of-type { flex: 1; }
  .q summary:hover span:first-of-type { color: var(--accent-dark); }
  .tags { flex: none; max-width: 40%; text-align: right; color: var(--muted); font-size: 13px; }
  .body { padding: 0 0 16px 20px; overflow-wrap: anywhere; }
  .body > :first-child { margin-top: 0; }
  .body pre { padding: 12px 14px; overflow-x: auto; background: var(--soft); border-radius: 8px;
              font: 13.5px/1.5 var(--mono); }
  .body code { font-family: var(--mono); font-size: .9em; background: var(--soft); padding: .1em .35em;
               border-radius: 4px; }
  .body pre code { padding: 0; background: none; font-size: inherit; }
  .body table { display: block; overflow-x: auto; border-collapse: collapse; }
  .body th, .body td { padding: 4px 10px; border: 1px solid var(--border); }
  .body img { max-width: 100%; }
  .plain { white-space: pre-wrap; }

  /* OA / Interviews switch */
  header .tabs { gap: 20px; padding-top: 0; padding-bottom: 0; font-size: 14px; }
  .tabs a { padding-bottom: 8px; color: var(--muted); text-decoration: none; border-bottom: 2px solid transparent; }
  .tabs a:hover { color: var(--text); }
  .tabs a.on { color: var(--text); font-weight: 600; border-color: var(--accent); }

  /* interviews: one written experience */
  .xp { margin-top: 30px; border-top: 1px solid var(--border); }
  .xp .drive { margin-top: 16px; }
  .proc { margin: 4px 0 0; }
  .rnd { margin: 18px 0 2px; font: 600 15px/1.4 var(--sans); }
  .rnd span { display: block; font-weight: 400; }
  .none { margin: 2px 0 0; }
  .xp .src { margin: 14px 0 0; }
  .more { margin-left: 8px; font-size: 14px; color: var(--accent-dark); }

  footer { margin-top: 56px; padding-bottom: 36px; }
  @media (max-width: 560px) { .tags { display: none; } h1 { font-size: 26px; } .brand { font-size: 19px; } }
</style>
</head>
<body>
<header><div class="wrap">
  <a class="brand" href="#/">Arigatho</a>
  <input id="q" type="search" placeholder="Company or question" aria-label="Search" autocomplete="off">
</div>
<nav class="wrap tabs" aria-label="Sections">
  <a id="tab-oa" href="#/">OA questions</a>
  <a id="tab-iv" href="#/i">Interviews</a>
</nav></header>
<main class="wrap"><p class="meta" style="margin-top:26px">Loading…</p></main>
<footer class="wrap"><p class="meta">Questions shared by students in OAHelper placement groups, sorted daily.
  Interview experiences also come from SWG IIT Kharagpur and other written first-hand accounts, each linked to its source.
  Internship drives are left out. <a href="https://github.com/MSR327/Arigatho">Source on GitHub</a></p></footer>

<script src="vendor/marked.min.js"></script>
<script src="vendor/purify.min.js"></script>
<script>
const main = document.querySelector("main"), q = document.getElementById("q");
const companies = new Map(), byId = new Map(), interviewCos = new Map();
let questions = [], iqs = [], experiences = [], updated = "";

const esc = s => String(s).replace(/[&<>"']/g, c => ({"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"})[c]);
const slug = s => s.toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, "") || "unknown";
const day = iso => new Date(iso + "T00:00:00").toLocaleDateString("en-GB", {day: "numeric", month: "short", year: "numeric"});
const known = v => v && v !== "Unknown";
const plural = (n, w) => `${n.toLocaleString("en-IN")} ${w}${n === 1 ? "" : "s"}`;

Promise.all([
  fetch("data.json").then(r => r.json()),
  fetch("interviews.json").then(r => r.json()).catch(() => ({experiences: []})),  // OA pages work without it
]).then(([d, iv]) => {
  questions = d.questions; updated = d.updated;
  for (const x of questions) {
    x.s = slug(x.c);
    x.hay = [x.c, x.t, x.x, x.col, x.pos, x.tp.join(" ")].join(" ").toLowerCase();
    if (!companies.has(x.s)) companies.set(x.s, {name: x.c, slug: x.s, qs: []});
    companies.get(x.s).qs.push(x);
    byId.set(x.id, x);
  }
  loadInterviews(iv.experiences);
  render();
}).catch(() => { main.innerHTML = '<p class="meta" style="margin-top:26px">Could not load the questions. Refresh to try again.</p>'; });

function interviewCo(name) {
  const s = slug(name);
  if (!interviewCos.has(s)) interviewCos.set(s, {name, slug: s, exps: [], chat: []});
  return interviewCos.get(s);
}

function loadInterviews(list) {
  experiences = list;
  for (const x of questions) if (x.r === "interview") interviewCo(x.c).chat.push(x);
  for (const e of list) {
    const c = interviewCo(e.c);
    c.exps.push(e);
    e.rounds.forEach((r, i) => r.qs.forEach((y, j) => {
      Object.assign(y, {id: `${e.id}-${i}-${j}`, s: c.slug, c: e.c, d: e.d, col: e.campus, also: "",
                        hay: [e.c, y.t, y.x, e.pos, e.campus, r.n, y.tp.join(" ")].join(" ").toLowerCase()});
      byId.set(y.id, y);
      iqs.push(y);
    }));
  }
}

// A company's interview count: written experiences plus drives reported in the chats
const chatKey = x => [x.d, x.col, x.role, x.pos].join("|");
const interviewCount = c => c.exps.length + new Set(c.chat.map(chatKey)).size;

function render() {
  const [, view, s, id] = location.hash.split("/");  // #/c/<company>/<question> or #/i/<company>/<question>
  document.getElementById("tab-oa").classList.toggle("on", view !== "i");
  document.getElementById("tab-iv").classList.toggle("on", view === "i");
  const term = q.value.trim().toLowerCase();
  if (term) return results(term.split(/\s+/), view === "i");
  if (view === "i") return interviewCos.has(s) ? interviewPage(interviewCos.get(s), id) : interviewsHome();
  if (view === "c" && companies.has(s)) return company(companies.get(s), id);
  home();
}

function az(items, href, count) {
  const letters = new Map();
  for (const c of [...items].sort((a, b) => a.name.localeCompare(b.name, "en", {sensitivity: "base"}))) {
    const L = /[a-z]/i.test(c.name[0]) ? c.name[0].toUpperCase() : "0–9";
    if (!letters.has(L)) letters.set(L, []);
    letters.get(L).push(c);
  }
  return `<div class="az">${[...letters].map(([L, cs]) => `<section><b>${L}</b>${cs.map(c =>
    `<a href="${href}${c.slug}"><span>${esc(c.name)}</span><span class="n">${count(c)}</span></a>`).join("")}</section>`).join("")}</div>`;
}

function home() {
  document.title = "Arigatho · OA questions by company";
  main.innerHTML = `<h1>OA questions, by company</h1>
    <p class="meta">${plural(questions.length, "question")} from ${companies.size} companies · updated ${esc(updated)}</p>`
    + az(companies.values(), "#/c/", c => c.qs.length);
}

function interviewsHome() {
  document.title = "Arigatho · Interview experiences by company";
  const chat = [...interviewCos.values()].reduce((n, c) => n + c.chat.length, 0);
  main.innerHTML = `<h1>Interviews, by company</h1>
    <p class="meta">${plural(experiences.length, "written experience")} · ${plural(iqs.length + chat, "question")} from ${interviewCos.size} companies · updated ${esc(updated)}</p>
    <p class="meta">What companies ask after the online test: written accounts from SWG IIT Kharagpur (last 2 years) and other first-hand posts (last year), each linked to its source, plus interview rounds shared in OAHelper chats.</p>`
    + az(interviewCos.values(), "#/i/", interviewCount);
}

function results(words, interviewsFirst) {
  const named = c => words.every(w => c.name.toLowerCase().includes(w));
  const has = x => words.every(w => x.hay.includes(w));
  const cs = [...companies.values()].filter(named), ics = [...interviewCos.values()].filter(named);
  const hits = questions.filter(has), ihits = iqs.filter(has);
  const row = (x, view) => `<a class="row" href="#/${view}/${x.s}/${x.id}"><span>${esc(x.t)}</span>
        <span class="meta">${[x.c, x.col].filter(known).map(esc).join(" · ")} · ${day(x.d)}</span></a>`;
  const oa = hits.length ? `<h2>${plural(hits.length, "question")}</h2>` + hits.slice(0, 200).map(x => row(x, "c")).join("")
    + (hits.length > 200 ? '<p class="meta">Showing the newest 200. Add a word to narrow it down.</p>' : "") : "";
  const iv = ihits.length ? `<h2>${plural(ihits.length, "interview question")}</h2>`
    + ihits.slice(0, 200).map(x => row(x, "i")).join("") : "";
  main.innerHTML = (cs.length ? `<h2>Companies</h2><div class="chips">${cs.map(c =>
      `<a class="chip" href="#/c/${c.slug}">${esc(c.name)} <span class="n">${c.qs.length}</span></a>`).join("")}</div>` : "")
    + (ics.length ? `<h2>Interviews</h2><div class="chips">${ics.map(c =>
      `<a class="chip" href="#/i/${c.slug}">${esc(c.name)} <span class="n">${interviewCount(c)}</span></a>`).join("")}</div>` : "")
    + (interviewsFirst ? iv + oa : oa + iv)
    + (hits.length || ihits.length ? "" : "<h2>No questions match</h2>");
}

const topTopics = qs => {
  const topics = new Map();
  for (const x of qs) for (const t of x.tp) topics.set(t, (topics.get(t) || 0) + 1);
  return [...topics].sort((a, b) => b[1] - a[1]).slice(0, 5).map(([t]) => esc(t));
};

const questionRow = y => `<details class="q" id="q-${esc(y.id)}"><summary><span>${esc(y.t)}</span>
            <span class="tags">${y.tp.map(esc).join(" · ")}</span></summary><div class="body"></div></details>`;

function chatDrives(qs, withRound) {
  const drives = new Map();
  for (const x of qs) {
    const k = [x.d, x.col, x.role, x.pos, x.r].join("|");
    if (!drives.has(k)) drives.set(k, []);
    drives.get(k).push(x);
  }
  return [...drives.values()].map(xs => {
    const x = xs[0], rnd = withRound && {interview: "Interview", other: "Other round"}[x.r];
    return `<div class="drive">${[day(x.d), x.col, x.role, x.pos, rnd].filter(known).map(esc).join(" · ")}</div>`
      + xs.map(questionRow).join("");
  }).join("");
}

function company(c, open) {
  document.title = `${c.name} · Arigatho`;
  const top = topTopics(c.qs), drives = new Set(c.qs.map(x => [x.d, x.col, x.role, x.pos, x.r].join("|"))).size;
  const iv = interviewCos.get(c.slug);
  main.innerHTML = `<p class="crumb"><a href="#/">← All companies</a></p>
    <h1>${esc(c.name)}</h1>
    <p class="meta">${plural(c.qs.length, "question")} · ${plural(drives, "drive")} · latest ${day(c.qs[0].d)}${top.length ? " · mostly " + top.join(", ") : ""}</p>
    <p class="tools"><button type="button" id="all">Open all</button>${iv ? `<a class="more" href="#/i/${c.slug}">Interview experiences (${interviewCount(iv)}) →</a>` : ""}</p>`
    + chatDrives(c.qs, true);
  wire("c", c.slug, open);
}

function experienceBlock(e) {
  const mode = e.mode === "unknown" ? "" : e.mode;
  return `<section class="xp" id="x-${esc(e.id)}">
    <div class="drive">${[day(e.d), e.pos, e.campus, mode].filter(known).map(esc).join(" · ")}</div>
    ${e.proc ? `<p class="proc">${esc(e.proc)}</p>` : ""}
    ${e.rounds.map(r => `<h3 class="rnd">${esc(r.n)}${r.dt ? `<span class="meta">${esc(r.dt)}</span>` : ""}</h3>`
      + (r.qs.length ? r.qs.map(questionRow).join("") : '<p class="meta none">No specific questions reported.</p>')).join("")}
    ${e.prep.length ? `<p class="meta"><b>Tips:</b> ${e.prep.map(esc).join(" · ")}</p>` : ""}
    <p class="meta src">Source: <a href="${esc(e.url)}" target="_blank" rel="noopener">${esc(e.src)}</a>${{"first-person": " · one person's post", anonymous: " · anonymous post, not verified"}[e.tier] || ""}</p>
  </section>`;
}

function interviewPage(c, open) {
  document.title = `${c.name} interviews · Arigatho`;
  const qs = c.exps.flatMap(e => e.rounds.flatMap(r => r.qs)).concat(c.chat);
  const latest = [...c.exps.map(e => e.d), ...c.chat.map(x => x.d)].sort().pop();
  const top = topTopics(qs), oa = companies.get(c.slug);
  const stats = [c.exps.length && plural(c.exps.length, "written experience"), plural(qs.length, "question"),
                 `latest ${day(latest)}`, top.length && "mostly " + top.join(", ")].filter(Boolean).join(" · ");
  main.innerHTML = `<p class="crumb"><a href="#/i">← All companies</a></p>
    <h1>${esc(c.name)} interviews</h1>
    <p class="meta">${stats}</p>
    <p class="tools">${qs.length ? '<button type="button" id="all">Open all</button>' : ""}${oa ? `<a class="more" href="#/c/${c.slug}">OA questions (${oa.qs.length}) →</a>` : ""}</p>`
    + c.exps.map(experienceBlock).join("")
    + (c.chat.length ? "<h2>Shared in OAHelper chats</h2>" + chatDrives(c.chat, false) : "");
  wire("i", c.slug, open);
}

function wire(view, s, open) {
  const all = [...main.querySelectorAll("details.q")];
  for (const d of all) d.addEventListener("toggle", () => {
    if (!d.open) return;
    fill(d);
    if (all.length < 2 || !all.every(e => e.open)) history.replaceState(null, "", `#/${view}/${s}/${d.id.slice(2)}`);
  });
  const btn = document.getElementById("all");
  if (btn) btn.onclick = () => {
    const opening = btn.textContent === "Open all";
    all.forEach(d => { d.open = opening; });
    btn.textContent = opening ? "Close all" : "Open all";
  };
  const target = open && document.getElementById("q-" + open);
  if (target) { target.open = true; target.scrollIntoView({block: "start"}); } else window.scrollTo(0, 0);
}

function fill(d) {
  const body = d.querySelector(".body");
  if (body.dataset.done) return;
  body.dataset.done = "1";
  const x = byId.get(d.id.slice(2));
  const extra = [
    x.lc && `${esc(x.lc.k)}: <a href="${esc(x.lc.u)}" target="_blank" rel="noopener">${esc(x.lc.n)}</a>`
      + (x.lc.d ? ` (${esc(x.lc.d)})` : "") + (x.lc.w ? `, ${esc(x.lc.w)}` : ""),
    x.also && `Also asked at ${esc(x.also)}`,
  ].filter(Boolean);
  const text = window.marked && window.DOMPurify
    ? DOMPurify.sanitize(marked.parse(x.x))
    : `<div class="plain">${esc(x.x)}</div>`;  // the libraries failed to load: plain text still reads fine
  body.innerHTML = text + (extra.length ? `<p class="meta">${extra.join(" · ")}</p>` : "");
}

window.addEventListener("hashchange", () => { q.value = ""; render(); });
q.addEventListener("input", render);
main.addEventListener("click", e => {  // a result for the page already in the address bar: no hashchange fires
  const a = e.target.closest('a[href^="#/"]');
  if (a && a.getAttribute("href") === location.hash) { q.value = ""; render(); }
});
document.addEventListener("keydown", e => {
  if (e.key === "/" && document.activeElement !== q) { e.preventDefault(); q.focus(); }
  if (e.key === "Escape" && document.activeElement === q) { q.value = ""; render(); }
});
</script>
</body>
</html>
